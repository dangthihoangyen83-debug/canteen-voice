<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giọng nói căn tin | Voice Gate thử nghiệm</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#173044;font:17px system-ui,Arial,sans-serif;padding:18px}main{max-width:680px;margin:auto;background:white;border-radius:20px;padding:24px;box-shadow:0 4px 22px #0001}h1{font-size:27px;color:#006a60}button{width:100%;padding:18px;border:0;border-radius:14px;color:white;background:#6e42c4;font-size:21px;cursor:pointer;margin:12px 0}button.secondary{background:#087e85}button:disabled{opacity:.5}.panel{background:#eef4f8;padding:16px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}#gate{width:1px;height:1px;position:absolute;left:-9999px;border:0}small{color:#586b79}</style></head>
<body><main><h1>🎙️ Giọng nói căn tin</h1><p>Thử nói <b>“Hết thịt kho măng”</b>. Đây là bản <b>CHỈ ĐỌC</b>, chưa thay đổi thực đơn.</p>
<button id="mic" disabled>🎙️ Bấm để nói</button><button class="secondary" id="test" disabled>🔎 Kiểm tra kết nối (không cần micro)</button>
<div id="status" class="panel">Đang kết nối trang trung gian Apps Script...</div><h3>Câu đã nghe</h3><div id="heard" class="panel">Chưa có</div><h3>Kết quả</h3><div id="result" class="panel">Chưa có</div><small>Không dùng JSONP. Trang trung gian gọi google.script.run; chưa ghi Sheets.</small>
<iframe id="gate" title="Voice Gate read-only" referrerpolicy="no-referrer"></iframe></main>
<script>
(function(){'use strict';
// DÁN URL /exec MỚI NHẤT CỦA CÙNG DỰ ÁN APPS SCRIPT VÀO DÒNG NÀY:
var WEB_APP_URL='https://script.google.com/macros/s/AKfycbxswxq_FSJyAJDHl-PUDhSS0-o1vRAmb61TWuYbiW-srlpKOcNMdaxIwIZ1TvCb231O/exec';
var CHANNEL='CANTEEN_VOICE_GATE_V1',GITHUB_ORIGIN=location.origin;
var gate=document.getElementById('gate'),mic=document.getElementById('mic'),test=document.getElementById('test'),status=document.getElementById('status'),heard=document.getElementById('heard'),result=document.getElementById('result');
var ready=false,pending=null,timer=null,SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setStatus(s){status.textContent=s;}
function makeId(){var a=new Uint8Array(12);crypto.getRandomValues(a);return 'vg_'+Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');}
function lookup(spoken){
 if(!ready){setStatus('Trang trung gian chưa sẵn sàng.');return;}
 if(pending){setStatus('Đang chờ phản hồi của lệnh trước.');return;}
 var id=makeId();pending=id;result.textContent='Đang tra cứu: '+spoken;
 timer=setTimeout(function(){if(pending===id){pending=null;result.textContent='Quá 20 giây không nhận phản hồi từ Apps Script.';}},20000);
 // targetOrigin là origin của iframe Apps Script; Google có thể dùng iframe lồng và khác origin.
 // Thử nghiệm READ_ONLY: gửi đến cửa sổ iframe cụ thể; phía gate vẫn kiểm tra origin GitHub.
 gate.contentWindow.postMessage({channel:CHANNEL,type:'LOOKUP',requestId:id,spoken:spoken},'*');
}
window.addEventListener('message',function(ev){
 if(ev.source!==gate.contentWindow)return;
 var d=ev.data;if(!d||d.channel!==CHANNEL)return;
 // Google có thể dùng script.google.com hoặc script.googleusercontent.com cho HTML Service.
 if(!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(ev.origin))return;
 if(d.type==='READY'){ready=true;mic.disabled=!SR;test.disabled=false;setStatus('✅ Trang trung gian đã kết nối. Có thể kiểm tra.');return;}
 if(d.type==='RESULT'&&pending&&d.requestId===pending){clearTimeout(timer);pending=null;
  var x=d.payload||{};result.textContent=JSON.stringify(x,null,2);
  setStatus(x.ok?'✅ Apps Script đã tìm được món. Chưa ghi dữ liệu.':'⚠️ Apps Script đã phản hồi: '+(x.code||'UNKNOWN'));
 }
});
test.onclick=function(){heard.textContent='Thử nghiệm không cần micro: Hết thịt kho măng';lookup('Hết thịt kho măng');};
mic.onclick=function(){if(!SR){setStatus('Trình duyệt không hỗ trợ SpeechRecognition.');return;}
 var r=new SR();r.lang='vi-VN';r.interimResults=false;r.continuous=false;mic.disabled=true;setStatus('🎙️ Đang nghe...');
 r.onresult=function(e){var spoken=String(e.results[0][0].transcript||'').trim();heard.textContent=spoken;lookup(spoken);};
 r.onerror=function(e){setStatus('Lỗi micro: '+e.error);};r.onend=function(){mic.disabled=!ready;};
 try{r.start();}catch(e){mic.disabled=!ready;setStatus('Không mở được micro: '+e.message);}
};
if(WEB_APP_URL.indexOf('PASTE_')===0){setStatus('⚠️ Chưa điền URL /exec triển khai mới vào WEB_APP_URL.');return;}
var u=WEB_APP_URL+(WEB_APP_URL.includes('?')?'&':'?')+'page=voice_gate&v='+Date.now();
gate.src=u;
setTimeout(function(){if(!ready)setStatus('⚠️ Chưa nhận READY từ VOICE_GATE. Kiểm tra URL /exec và quyền nhúng iframe.');},15000);
})();
</script></body></html>
