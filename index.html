<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra giọng nói căn tin</title><style>body{font-family:system-ui,Arial,sans-serif;max-width:680px;margin:0 auto;padding:24px;background:#f7f7ff;color:#20203b}main{background:white;padding:24px;border-radius:18px;box-shadow:0 4px 22px #2221}button{font-size:19px;padding:14px 18px;border:0;border-radius:12px;background:#6941c6;color:white;margin:8px 8px 8px 0}button:disabled{opacity:.5}#stop{background:#b42318}pre{white-space:pre-wrap;word-break:break-word;background:#f2f4f7;padding:14px;border-radius:10px;min-height:70px}small{color:#555}</style></head><body><main><h1>🎙️ Kiểm tra giọng nói</h1><p>Thử đọc: “Thêm bò kho ba mươi phần”. Trang chỉ nhận diện, <strong>không lưu dữ liệu</strong>.</p><button id="start">Bắt đầu nghe</button><button id="stop" disabled>Dừng nghe</button><p id="status" role="status">Chưa bắt đầu.</p><h3>Nội dung nhận diện</h3><pre id="result">Chưa có</pre><h3>Thông tin kỹ thuật</h3><pre id="diagnostic"></pre><small>Chỉ hoạt động trên trình duyệt hỗ trợ Web Speech API. Trình duyệt có thể gửi âm thanh đến dịch vụ nhận diện của nhà cung cấp.</small></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,active=false;function state(s){$('status').textContent=s}function buttons(on){$('start').disabled=on;$('stop').disabled=!on}function diag(extra=''){$('diagnostic').textContent='HTTPS an toàn: '+window.isSecureContext+'\nTrong iframe: '+(window.self!==window.top)+'\nSpeechRecognition hỗ trợ: '+Boolean(SR)+'\n'+extra}diag();$('start').onclick=()=>{if(!SR){state('Trình duyệt này không hỗ trợ SpeechRecognition. Hãy thử Chrome.');return}try{rec=new SR();rec.lang='vi-VN';rec.continuous=true;rec.interimResults=true;rec.onstart=()=>{active=true;buttons(true);state('Đang nghe...')};rec.onresult=e=>{let final='',interim='';for(let i=0;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t+' '} $('result').textContent=(final+interim).trim()||'Chưa có';state(interim?'Đang nhận diện...':'Đã nhận diện. Có thể nói tiếp.')};rec.onerror=e=>{state('Lỗi nhận diện: '+e.error);diag('Chi tiết: '+e.error+(e.message?' | '+e.message:''))};rec.onend=()=>{active=false;buttons(false);if(!$('status').textContent.startsWith('Lỗi'))state('Đã dừng nghe.')};rec.start()}catch(e){state('Không thể bắt đầu: '+e.message);buttons(false)}};$('stop').onclick=()=>{if(rec&&active)rec.stop()};})();
</script></body></html>
